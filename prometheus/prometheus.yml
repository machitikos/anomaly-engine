global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']  # Kafka doesn't expose Prometheus metrics by default; use JMX exporter if needed

  - job_name: 'risingwave'
    static_configs:
      - targets: ['risingwave:5691']

  - job_name: 'scorer'
    static_configs:
      - targets: ['scorer:8000']
    metrics_path: '/metrics'

  - job_name: 'generator'
    static_configs:
      - targets: ['generator:8080']

  # PostgreSQL requires postgres_exporter sidecar (not included for simplicity)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']