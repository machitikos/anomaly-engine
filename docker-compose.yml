version: '3.8'

services:
  # ==========================================
  # MESSAGE STREAMING - Redpanda (Kafka-compatible)
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    container_name: anomaly-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --default-topic-partitions=3
      - --default-topic-replications=1
    ports:
      - "9092:9092"      # Internal Kafka
      - "19092:19092"    # External Kafka (from host)
      - "8081:8081"      # Schema Registry
      - "8082:8082"      # HTTP Proxy
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --timeout 3s"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # STREAM PROCESSING - RisingWave
  # ==========================================
  risingwave:
    image: risingwavelabs/risingwave:latest
    container_name: anomaly-risingwave
    command: >
      standalone
      --meta-node-role=all
    ports:
      - "4566:4566"      # PostgreSQL wire protocol
      - "5691:5691"      # Metrics
    volumes:
      - risingwave-data:/risingwave/data
      - ./risingwave/init.sql:/docker-entry-point-initdb.d/init.sql:ro
    environment:
      - RW_TOTAL_MEMORY_MB=2048
      - RW_STORAGE_MEMORY_MB=1024
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-U", "root", "-d", "dev", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # METADATA / FEATURE STORE - PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: anomaly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: anomaly_engine
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomaly123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================
  # MODEL SERVING - FastAPI + ONNX Runtime
  # ==========================================
  scorer:
    build:
      context: ./scorer
      dockerfile: Dockerfile
    container_name: anomaly-scorer
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model.onnx
      - REDPANDA_BROKERS=redpanda:9092
      - RISINGWAVE_DSN=postgresql://root@risingwave:4566/dev
      - POSTGRES_DSN=postgresql://anomaly:anomaly123@postgres:5432/anomaly_engine
    volumes:
      - ./scorer/model.onnx:/app/model.onnx:ro
    depends_on:
      redpanda:
        condition: service_healthy
      risingwave:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # SYNTHETIC DATA GENERATOR
  # ==========================================
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: anomaly-generator
    environment:
      - REDPANDA_BROKERS=redpanda:9092
      - TOPIC=txns.raw
      - RATE=100  # transactions per second
      - FRAUD_RATE=0.02
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================
  # MONITORING - Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: anomaly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - redpanda
      - risingwave
      - scorer

  # ==========================================
  # VISUALIZATION - Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: anomaly-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ==========================================
  # DASHBOARD UI - React (Optional)
  # ==========================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: anomaly-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - scorer
    profiles:
      - ui  # Run with: docker-compose --profile ui up

volumes:
  redpanda-data:
  risingwave-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: anomaly-network