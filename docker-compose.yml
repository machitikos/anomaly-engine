version: '3.8'

services:
  # ==========================================
  # MESSAGE STREAMING - Kafka + Zookeeper
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: anomaly-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: anomaly-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==========================================
  # STREAM PROCESSING - RisingWave
  # ==========================================
  risingwave:
    image: risingwavelabs/risingwave:v1.10.0
    container_name: anomaly-risingwave
    command: ["single"]
    ports:
      - "4566:4566"
      - "5691:5691"
    volumes:
      - risingwave-data:/risingwave/data
      - ./risingwave/init.sql:/docker-entry-point-initdb.d/init.sql:ro
    environment:
      - RW_TOTAL_MEMORY_MB=2048
      - RW_STORAGE_MEMORY_MB=1024
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c \"</dev/tcp/localhost/4566\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # METADATA / FEATURE STORE - PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: anomaly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: anomaly_engine
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomaly123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================
  # MODEL SERVING - FastAPI + ONNX Runtime
  # ==========================================
  scorer:
    build:
      context: ./scorer
      dockerfile: Dockerfile
    container_name: anomaly-scorer
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model.onnx
      - KAFKA_BROKERS=kafka:9092
      - RISINGWAVE_DSN=postgresql://root@risingwave:4566/dev
      - POSTGRES_DSN=postgresql://anomaly:anomaly123@postgres:5432/anomaly_engine
    volumes:
      - ./scorer/model.onnx:/app/model.onnx:ro
    depends_on:
      kafka:
        condition: service_healthy
      risingwave:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # SYNTHETIC DATA GENERATOR
  # ==========================================
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: anomaly-generator
    environment:
      - KAFKA_BROKERS=kafka:9092
      - TOPIC=txns.raw
      - RATE=100
      - FRAUD_RATE=0.02
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================
  # MONITORING - Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: anomaly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - kafka
      - risingwave
      - scorer

  # ==========================================
  # VISUALIZATION - Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: anomaly-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ==========================================
  # DASHBOARD UI - React (Optional)
  # ==========================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: anomaly-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - scorer
    profiles:
      - ui

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  risingwave-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: anomaly-network